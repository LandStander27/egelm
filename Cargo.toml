[package]
name = "egelm"
version = "0.1.0"
edition = "2024"

[workspace]
resolver = "3"
members = ["egelm-macros"]

[lints.rust]
missing_docs = "warn"

[lints.clippy]
tabs_in_doc_comments = "allow"

[features]
default = ["ctrlc", "tracing", "emojis"]
ctrlc = ["dep:ctrlc"]
tracing = ["dep:tracing"]
emojis = ["dep:emojis"]

[dependencies]
egelm-macros = { path = "./egelm-macros" }

ctrlc = { version = "3.5.2", optional = true }
tracing = { version = "0.1.44", optional = true }
emojis = { version = "0.9.0", optional = true }

egui = "0.35.0"
egui_glow = { version = "0.35.0", features = ["winit", "wayland"] }
egui-winit = { version = "0.35.0", features = ["wayland"] }
glutin = { version = "0.32.3", features = ["wayland"] }
glutin-winit = { version = "0.5.0", features = ["wayland"] }
tokio = { version = "1.53.1", features = ["rt"] }
crossbeam-channel = "0.5.16"
thiserror = "2.0.19"

[dev-dependencies]
tokio = { version = "1.53.1", features = [
	"rt",
	"macros",
	"rt-multi-thread",
	"time",
] }