[package]
name = "egelm"
version.workspace = true
edition.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true

[package.metadata.release]
pre-release-hook = [
	"git",
	"cliff",
	"-o",
	"CHANGELOG.md",
	"--tag",
	"{{version}}",
]
pre-release-replacements = [
	{ file = "README.md", search = "egelm = .*", replace = "{{crate_name}} = \"{{version}}\"" },
]

[workspace]
resolver = "3"
members = ["egelm-macros"]

[workspace.metadata.release]
allow-branch = ["master"]
sign-commit = true
sign-tag = true
consolidate-commits = true
pre-release-commit-message = "release: {{version}}"
tag-name = "v{{version}}"
tag-message = "{{version}}"
push = true
publish = true
tag = true
enable-all-features = true
shared-version = true

[workspace.package]
version = "0.2.2"
edition = "2024"
description = "A simple Elm-like framework for building GUI applications in Rust using egui."
license = "MIT"
repository = "https://codeberg.org/Land/egelm"

[lints.rust]
missing_docs = "warn"

[lints.clippy]
tabs_in_doc_comments = "allow"

[features]
default = ["ctrlc", "tracing", "emoji", "wgpu"]
ctrlc = ["dep:ctrlc"]
tracing = ["dep:tracing"]
emoji = ["dep:emojis"]
glow = ["dep:egui_glow", "dep:glutin", "dep:glutin-winit"]
wgpu = ["dep:egui-wgpu", "dep:pollster"]

[dependencies]
egelm-macros = { version = "=0.2.2", path = "./egelm-macros" }

ctrlc = { version = "3.5.2", optional = true }
tracing = { version = "0.1.44", optional = true }
emojis = { version = "0.9.0", optional = true }

egui = "0.35.0"
egui_glow = { version = "0.35.0", features = [
	"winit",
	"wayland",
], optional = true }
egui-wgpu = { version = "0.35.0", features = [
	"winit",
	"wayland",
], optional = true }
egui-winit = { version = "0.35.0", features = ["wayland"] }
glutin = { version = "0.32.3", features = ["wayland"], optional = true }
glutin-winit = { version = "0.5.0", features = ["wayland"], optional = true }
pollster = { version = "0.4.0", optional = true }
tokio = { version = "1.53.1", features = ["rt"] }
crossbeam-channel = "0.5.16"
thiserror = "2.0.19"

[dev-dependencies]
tokio = { version = "1.53.1", features = [
	"rt",
	"macros",
	"rt-multi-thread",
	"time",
] }
