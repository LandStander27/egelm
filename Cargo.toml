[package]
name = "egelm"
version.workspace = true
edition.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true

[package.metadata.docs.rs]
all-features = true

[package.metadata.release]
pre-release-hook = [
	"git",
	"cliff",
	"-o",
	"CHANGELOG.md",
	"--tag",
	"{{version}}",
]
pre-release-replacements = [
	{ file = "README.md", search = "egelm = .*", replace = "{{crate_name}} = \"{{version}}\"" },
]

[workspace]
resolver = "3"
members = ["egelm-macros", "examples/android"]

[workspace.metadata.release]
allow-branch = ["master"]
sign-commit = true
sign-tag = true
consolidate-commits = true
pre-release-commit-message = "release: {{version}}"
tag-name = "v{{version}}"
tag-message = "{{version}}"
push = true
publish = true
tag = true
enable-all-features = true
shared-version = true

[workspace.package]
version = "0.5.0"
edition = "2024"
description = "A simple message-driven framework for building GUI applications in Rust using egui."
license = "MIT"
repository = "https://codeberg.org/Land/egelm"

[lints.rust]
missing_docs = "warn"

[lints.clippy]
tabs_in_doc_comments = "allow"

[features]
default = ["ctrlc", "emoji", "accesskit"]
storage = ["egui/persistence", "dep:ron", "dep:serde", "dep:dirs"]
ctrlc = ["dep:ctrlc"]
emoji = ["dep:emojis"]
glow = ["dep:egui_glow", "dep:glutin", "dep:glutin-winit"]
wgpu = ["dep:egui-wgpu", "dep:pollster"]
wayland = [
	"egui_glow?/wayland",
	"egui-wgpu?/wayland",
	"egui-winit/wayland",
	"glutin?/wayland",
	"glutin-winit?/wayland",
	"glutin?/egl",
	"glutin-winit?/egl",
]
x11 = [
	"egui-winit/x11",
	"glutin-winit?/x11",
	"glutin?/x11",
	"glutin?/glx",
	"glutin-winit?/glx",
]
android = ["egui-winit/android-native-activity", "wgpu"]
windows = ["glutin?/wgl", "glutin-winit?/wgl"]
accesskit = ["egui-winit/accesskit"]

[dependencies]
egelm-macros = { version = "=0.5.0", path = "egelm-macros" }

tracing = "0.1.44"
emojis = { version = "0.9.0", optional = true }

egui = "0.36.1"
egui-wgpu = { version = "0.36.1", features = ["winit"], optional = true }
egui-winit = { version = "0.36.1", default-features = false, features = [
	"clipboard",
	"links",
] }
pollster = { version = "0.4.0", optional = true }
crossbeam-channel = "0.5.16"
thiserror = "2.0.19"
serde = { version = "1.0.229", optional = true }
ron = { version = "0.12.2", optional = true }
dirs = { version = "6.0.0", optional = true }
tokio = { version = "1.53.1", features = ["rt"] }
tokio-util = { version = "0.7.19" }

[target.'cfg(not(target_os = "android"))'.dependencies]
ctrlc = { version = "3.5.2", optional = true }
egui_glow = { version = "0.36.1", features = ["winit"], optional = true }
glutin = { version = "0.32.3", default-features = false, optional = true }
glutin-winit = { version = "0.5.0", default-features = false, optional = true }

[dev-dependencies]
tokio = { version = "1.53.1", features = [
	"rt",
	"macros",
	"rt-multi-thread",
	"time",
] }
tracing-subscriber = { version = "0.3.17" }

[build-dependencies]
cfg_aliases = "0.2.1"
